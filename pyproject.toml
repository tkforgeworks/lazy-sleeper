[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazy-sleeper"
version = "0.1.1"
description = "Draft-day companion and in-season roster assistant for Sleeper NFL fantasy leagues"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=17",
    "orjson>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
lazy = "lazy_sleeper.jobs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lazy_sleeper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["lazy_sleeper"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E501"]
