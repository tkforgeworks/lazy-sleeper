name: daily-pull

# The pre-draft "puller box" is this workflow, not a machine (LS-17): every run checks out `main`,
# so there is nothing to keep updated. It pulls fresh Sleeper/ESPN/crosswalk snapshots (mirrored to
# Supabase Storage), loads them into the shared Supabase Postgres, and prints the freshness audit.
# A failed run shows up as a red workflow + GitHub's failure notification. Run it by hand from the
# Actions tab (workflow_dispatch) to test or to catch up after a miss.
#
# Required repository secrets: DATABASE_URL (Supabase Postgres, SQLAlchemy URL), SUPABASE_URL,
# SUPABASE_SECRET_KEY, SLEEPER_LEAGUE_ID, SLEEPER_DRAFT_ID, SLEEPER_USER_ID.

on:
  schedule:
    - cron: "23 9 * * *" # 05:23 ET (EDT); odd minute — on-the-hour crons are contended and drifted 4h (both 2026-09-02/03 runs landed ~14:00 UTC, inside a Supabase IO stall)
  workflow_dispatch:
    inputs:
      season:
        description: "Season to pull"
        default: "2026"
        required: false

permissions:
  contents: read

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    name: pull daily
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: raw-snapshots
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      SLEEPER_DRAFT_ID: ${{ secrets.SLEEPER_DRAFT_ID }}
      SLEEPER_USER_ID: ${{ secrets.SLEEPER_USER_ID }}
      SNAPSHOT_DIR: ./data/snapshots
      # The runner's archive dies with the job: a snapshot that cannot be mirrored to Storage
      # must fail the pull here, not be registered with no file behind it (2026-09-02/03).
      SNAPSHOT_REQUIRE_MIRROR: "true"
      # 30 s (the API default) is too tight for bulk loads when Supabase's nano compute is
      # IO-starved — the 2026-09-03 run died on a QueryCanceled at exactly 30 s.
      DB_STATEMENT_TIMEOUT_MS: "120000"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Preflight (secrets present, DB reachable, schema current)
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret missing"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret missing"; exit 1; }
          uv run alembic current
      - name: Pull daily (players, season projections/ADP, ESPN, crosswalk)
        run: uv run lazy pull daily --season "${{ inputs.season || '2026' }}"
      - name: Load into core.*
        # Loads are idempotent upserts, so a retry after a transient DB stall is safe.
        run: |
          for attempt in 1 2 3; do
            if uv run lazy load players && uv run lazy load crosswalk && uv run lazy load stats && uv run lazy load byes --season "${{ inputs.season || '2026' }}"; then
              exit 0
            fi
            echo "::warning::load attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          echo "all load attempts failed"
          exit 1
      - name: Freshness audit
        run: uv run lazy check freshness
      - name: Regenerate the draft board (derived.boards + CSV/HTML)
        run: uv run lazy board regen --season "${{ inputs.season || '2026' }}"
      - name: Upload board exports
        uses: actions/upload-artifact@v4
        with:
          name: board-${{ github.run_id }}
          path: data/boards/board_latest.*
          retention-days: 14
