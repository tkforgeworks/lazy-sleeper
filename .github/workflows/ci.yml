name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lazysleeper
          POSTGRES_PASSWORD: lazysleeper
          POSTGRES_DB: lazysleeper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazysleeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lazysleeper:lazysleeper@localhost:5432/lazysleeper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: Migrations (upgrade + downgrade + upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
